# ==============================================================================
# Factor PostgreSQL Infrastructure Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# Project Paths
# ------------------------------------------------------------------------------
PROJECT_ROOT=/Users/firmansyah.profess/factor-workspace/firmansyah.factor.postgres
CONFIG_XML=/Users/firmansyah.profess/factor-workspace/firmansyah.factor.postgres/firmansyah.factor.postgres.config.xml

# ------------------------------------------------------------------------------
# PostgreSQL Connection Properties
# ------------------------------------------------------------------------------
DB_USER=factor
DB_PASSWORD=factor
DB_NAME=factor
POSTGRES_PORT=5432

# ------------------------------------------------------------------------------
# Docker Images and Container Definition
# ------------------------------------------------------------------------------
POSTGRES_IMAGE=postgres:latest
POSTGRES_CONTAINER=postgres-db

# ------------------------------------------------------------------------------
# Docker Volumes Definition
# ------------------------------------------------------------------------------
# Base Directory for Docker Volumes. Will be expanded during script execution.
VOLUME_BASE_DIR=~/docker-volumes

# ------------------------------------------------------------------------------
# Docker Containers Resource Limits
# ------------------------------------------------------------------------------
# CPU cores allocation (e.g., '1.5' for one and a half core)
LIMIT_CPU=4.0

# Memory hard limit (e.g., '512m', '1g')
LIMIT_MEMORY=1g

# Swap memory limit (Set to same as LIMIT_MEMORY to disable swap entirely)
LIMIT_SWAP=1g

# Note: Docker doesn't support generic disk size limiting on all storage drivers.
# However, you can use volume limits or specific driver configurations.
# Not added to start arguments by default unless specific engine features are used.
LIMIT_DISK_SIZE=10g
